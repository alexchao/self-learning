# Fly.io config for the cloud learning server (docs/plans/cloud-deployment.md).
# One always-on machine: next-session prep keeps running in the background after the learner closes the tab.
app = 'quiet-lantern-4747'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # First boot clones the repo, runs npm ci, and builds the web app before the server listens.
    grace_period = '180s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[mounts]]
  source = 'data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
